plugins { id 'com.android.application' }
android {
    namespace 'com.stillfocus.app'
    compileSdk 35
    defaultConfig { applicationId 'com.stillfocus.app'; minSdk 26; targetSdk 35; versionCode 30; versionName '0.29.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release { minifyEnabled false }
        // Non-debuggable device testing; reuse the existing development certificate for upgrades.
        // This is not a production signing identity or Google Play review/verification.
        device {
            initWith release
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
